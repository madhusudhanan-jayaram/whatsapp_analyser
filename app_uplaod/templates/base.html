{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>WhatsApp Analyser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
      body {
        background: linear-gradient(135deg, #232526 0%, #414345 100%);
        min-height: 100vh;
        font-family: 'Montserrat', sans-serif;
        position: relative;
        color: #f5f7fa;
      }
      .whatsapp-bg {
        position: absolute;
        bottom: 24px; right: 24px;
        z-index: 0;
        opacity: 0.18;
        pointer-events: none;
      }
      .whatsapp-bg svg {
        width: 120px;
        height: 120px;
        animation: pulse 2.5s infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      .navbar {
        background-color: #075E54;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      }
      .navbar-brand, .nav-link {
        color: #fff !important;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .navbar-nav .nav-link.active {
        color: #25D366 !important;
      }
      .container {
        margin-top: 40px;
        margin-bottom: 40px;
        background: transparent;
        border-radius: 0;
        box-shadow: none;
        padding: 0;
        position: relative;
        z-index: 1;
      }
      .btn-primary, .btn-success, .btn-info {
        font-size: 1.1rem;
        font-weight: 700;
        border-radius: 30px;
        padding: 0.6em 2em;
        box-shadow: 0 2px 8px rgba(44,62,80,0.12);
        transition: background 0.2s, color 0.2s;
      }
      .btn-primary:hover, .btn-success:hover, .btn-info:hover {
        background: #25D366;
        color: #232526;
      }
      .navbar-toggler {
        border-radius: 50%;
        border: 2px solid #25D366;
      }
      .navbar-toggler-icon {
        background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%2837,211,102,0.7%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
      }
    </style>
  </head>
  <body>
    <div class="whatsapp-bg">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="24" r="24" fill="#25D366"/>
        <path d="M34.5 13.5C32.1 11.1 29.2 10 26.1 10C19.2 10 13.5 15.7 13.5 22.6C13.5 24.7 14.1 26.7 15.2 28.5L13 36L20.7 33.8C22.4 34.7 24.2 35.1 26.1 35.1C33 35.1 38.7 29.4 38.7 22.5C38.7 19.4 37.5 16.5 35.1 14.1L34.5 13.5ZM26.1 32.7C24.5 32.7 22.9 32.3 21.5 31.5L21.1 31.3L16.7 32.5L17.9 28.1L17.7 27.7C16.7 26.1 16.1 24.4 16.1 22.6C16.1 17.2 20.7 12.6 26.1 12.6C28.2 12.6 30.2 13.4 31.8 14.9C33.4 16.5 34.2 18.5 34.2 20.6C34.2 26 29.6 30.6 24.2 30.6C23.1 30.6 22.1 30.3 21.2 29.8L20.8 29.6L17.7 30.5L18.6 27.4L18.4 27.1C17.7 25.9 17.3 24.3 17.3 22.6C17.3 18.1 21.1 14.3 25.6 14.3C27.7 14.3 29.7 15.1 31.3 16.7C32.9 18.3 33.7 20.3 33.7 22.4C33.7 27.9 29.1 32.5 23.6 32.5C22.5 32.5 21.5 32.2 20.6 31.7L20.2 31.5L17.1 32.4L18 29.3L17.8 29C17.1 27.8 16.7 26.2 16.7 24.5C16.7 19.1 21.3 14.5 26.7 14.5C28.8 14.5 30.8 15.3 32.4 16.9C34 18.5 34.8 20.5 34.8 22.6C34.8 28 30.2 32.6 24.8 32.6C23.7 32.6 22.7 32.3 21.8 31.8L21.4 31.6L18.3 32.5L19.2 29.4L19 29.1C18.3 27.9 17.9 26.3 17.9 24.6C17.9 19.2 22.5 14.6 27.9 14.6C30 14.6 32 15.4 33.6 17C35.2 18.6 36 20.6 36 22.7C36 28.1 31.4 32.7 25.9 32.7H26.1Z" fill="#fff"/>
      </svg>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <a class="navbar-brand" href="{% url 'app_uplaod:image_upload' %}">WhatsApp Analyser</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ml-auto">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/app_uplaod/' %}active{% endif %}" href="{% url 'app_uplaod:image_upload' %}">Whatsapp Filrt Analysis</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/app_uplaod/result' %}active{% endif %}" href="{% url 'app_uplaod:result' %}">Result Table</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/app_uplaod/aboutus' %}active{% endif %}" href="{% url 'app_uplaod:aboutus' %}">About us</a>
          </li>
        </ul>
      </div>
    </nav>
    <main class="container">
      {% block body_block %}
      {% endblock %}
    </main>
    <footer class="text-center text-muted py-3">
      <small>&copy; {{ now|date:'Y' }} WhatsApp Analyser. All rights reserved.</small>
    </footer>
  </body>
</html>
