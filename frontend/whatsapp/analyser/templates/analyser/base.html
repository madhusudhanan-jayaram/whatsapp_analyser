{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WhatsApp Chat Analysis</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'analyser/style.css' %}" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }
        .footer {
            background: #222;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'dashboard' %}">
      <img src="https://img.icons8.com/color/48/000000/whatsapp--v1.png" alt="Logo" width="36" height="36" class="me-2">
      WhatsApp Dashboard
    </a>
  </div>
</nav>
<main class="container py-4 bg-white rounded shadow-sm">
    {% block content %}{% endblock %}
</main>
<footer class="footer">
    <div class="container">
        <span>&copy; {{ now|date:'Y' }} WhatsApp Chat Analyser</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
